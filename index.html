<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ango 3D - Point-E Stable</title>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; background: #010409; color: #e6edf3; font-family: sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 15px; left: 15px; z-index: 100; background: #0d1117; padding: 20px; border-radius: 12px; width: 260px; border: 1px solid #30363d; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #30363d; background: #010409; color: #58a6ff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #238636; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; color: white; width: 100%; }
        button:disabled { background: #21262d; color: #484f58; }
        #status { font-size: 11px; margin-top: 15px; color: #8b949e; text-align: center; font-family: monospace; }
        #viewer { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div id="ui">
    <b style="color:#58a6ff">ANGO 3D - FREE ENGINE</b>
    <input type="text" id="promptInput" placeholder="Ej: A red motorcycle, a cat...">
    <button id="generateBtn">GENERAR 3D</button>
    <div id="status">ESTADO: LISTO</div>
</div>

<div id="viewer"></div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

    // TOKEN Y URL (Modelo Point-E de OpenAI, más estable en API Gratis)
    const HF_TOKEN = "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";
    const API_URL = "https://api-inference.huggingface.co/models/openai/point-e";

    let scene, camera, renderer, controls, points;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('viewer').appendChild(renderer.domElement);
        controls = new OrbitControls(camera, renderer.domElement);
        animate();
    }

    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }

    async function generate() {
        const prompt = document.getElementById('promptInput').value.trim();
        const status = document.getElementById('status');
        const btn = document.getElementById('generateBtn');

        if(!prompt) return;
        btn.disabled = true;
        status.innerText = "CONECTANDO CON IA...";

        try {
            const response = await fetch(API_URL, {
                headers: { 
                    "Authorization": `Bearer ${HF_TOKEN}`,
                    "Content-Type": "application/json"
                },
                method: "POST",
                body: JSON.stringify({ inputs: prompt })
            });

            // Si no es 200 OK, analizamos por qué
            if (!response.ok) {
                const errorData = await response.json();
                if (errorData.error && errorData.error.includes("currently loading")) {
                    status.innerText = "MODELO CARGANDO... ESPERA 20 SEG.";
                } else {
                    status.innerText = "ERROR: " + (errorData.error || "Servidor saturado");
                }
                btn.disabled = false;
                return;
            }

            // Si llegamos aquí, la respuesta es el archivo 3D
            const blob = await response.blob();
            const buffer = await blob.arrayBuffer();
            const loader = new PLYLoader();
            
            try {
                const geometry = loader.parse(buffer);
                const material = new THREE.PointsMaterial({ size: 0.03, vertexColors: true });

                if(points) scene.remove(points);
                points = new THREE.Points(geometry, material);
                
                // Centrado automático
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                points.position.sub(center);
                
                scene.add(points);
                status.innerText = "¡MODELO GENERADO!";
            } catch (err) {
                status.innerText = "ERROR AL PROCESAR 3D";
            }

        } catch (e) {
            status.innerText = "ERROR DE RED";
        } finally {
            btn.disabled = false;
        }
    }

    document.getElementById('generateBtn').onclick = generate;
    init();
</script>
</body>
</html>
