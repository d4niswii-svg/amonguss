<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Firebase ROI Selector</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100vh; font-family: sans-serif; }
        #game-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.4; }
        #selector-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: crosshair; }
        #ui-panel { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #fff; padding: 15px; border-radius: 12px; z-index: 20; width: 85%; text-align: center; border: 1px solid #ff9800; }
        button { background: #ff9800; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 10px; }
        #status { font-size: 13px; color: #0f0; margin-bottom: 5px; font-family: monospace; }
    </style>
</head>
<body>

    <video id="game-video" autoplay playsinline></video>
    <canvas id="selector-canvas"></canvas>

    <div id="ui-panel">
        <div id="status">SISTEMA LISTO: INICIA CAPTURA</div>
        <button id="btn-start">INICIAR LECTURA PANTALLA</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Tu configuración que proporcionaste
        const firebaseConfig = {
            apiKey: "AIzaSyC_MyjSFLB-mHDWWaOfAlRetLDB_pAxgR0",
            authDomain: "ango-592a4.firebaseapp.com",
            databaseURL: "https://ango-592a4-default-rtdb.firebaseio.com",
            projectId: "ango-592a4",
            storageBucket: "ango-592a4.firebasestorage.app",
            messagingSenderId: "234305709468",
            appId: "1:234305709468:web:4a3009360c6033649dd459",
            measurementId: "G-4YVSD60SP6"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Variables de UI y Canvas
        const video = document.getElementById('game-video');
        const canvas = document.getElementById('selector-canvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('btn-start');
        const status = document.getElementById('status');

        let isDrawing = false;
        let startX, startY;
        let roi = { x: 0, y: 0, w: 0, h: 0 };

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- 1. Iniciar Captura ---
        btn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                video.srcObject = stream;
                status.innerText = "DIBUJA EL RECUADRO EN PANTALLA";
                btn.style.display = "none";
            } catch (err) {
                status.innerText = "ERROR: " + err.message;
            }
        };

        // --- 2. Eventos Táctiles ---
        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const curX = e.touches[0].clientX;
            const curY = e.touches[0].clientY;

            roi.x = Math.min(startX, curX);
            roi.y = Math.min(startY, curY);
            roi.w = Math.abs(startX - curX);
            roi.h = Math.abs(startY - curY);

            drawSelection();
        });

        canvas.addEventListener('touchend', () => {
            isDrawing = false;
            saveToFirebase();
        });

        function drawSelection() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#ff9800";
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]); // Línea punteada
            ctx.strokeRect(roi.x, roi.y, roi.w, roi.h);
        }

        // --- 3. Guardar en Firebase ---
        function saveToFirebase() {
            status.innerText = "GUARDANDO EN CLOUD...";
            
            // Referencia en la base de datos (sección 'current_roi')
            const roiRef = ref(db, 'macros/osrs_config');
            
            set(roiRef, {
                x: Math.round(roi.x),
                y: Math.round(roi.y),
                width: Math.round(roi.w),
                height: Math.round(roi.h),
                timestamp: Date.now()
            }).then(() => {
                status.innerText = "✅ COORDENADAS SINCRONIZADAS";
                setTimeout(() => status.innerText = "DIBUJA OTRA ZONA O ABRE OSRS", 2000);
            }).catch((error) => {
                status.innerText = "❌ ERROR DB: " + error.message;
            });
        }
    </script>
</body>
</html>
