
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Generator - Shap-E</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            width: 300px;
        }

        h2 { margin-top: 0; font-size: 1.2rem; color: var(--accent); }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #viewer {
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        #status {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="ui-container">
    <h2>Shap-E Generator</h2>
    <p style="font-size: 0.8rem;">Escribe lo que deseas generar en 3D:</p>
    <input type="text" id="promptInput" placeholder="Ej: A shark, a chair, a donut...">
    <button id="generateBtn">Generar Modelo 3D</button>
    <div class="loader" id="loader"></div>
    <div id="status">Listo para generar.</div>
</div>

<div id="viewer"></div>

<script>
    // Configuración de API
    const HF_TOKEN = "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";
    const MODEL_URL = "https://api-inference.huggingface.co/models/openai/shap-e";

    // Variables de Three.js
    let scene, camera, renderer, controls, currentMesh;

    function initThree() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('viewer').appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 2);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    async function queryModel(prompt) {
        const status = document.getElementById('status');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('generateBtn');

        status.innerText = "Generando... (esto puede tardar 1-2 min)";
        loader.style.display = "block";
        btn.disabled = true;

        try {
            const response = await fetch(MODEL_URL, {
                headers: { Authorization: `Bearer ${HF_TOKEN}` },
                method: "POST",
                body: JSON.stringify({ inputs: prompt }),
            });

            if (!response.ok) throw new Error("Error en la API de Hugging Face");

            const blob = await response.blob();
            processModel(blob);
            
            status.innerText = "¡Generación completada!";
        } catch (error) {
            status.innerText = "Error: " + error.message;
            console.error(error);
        } finally {
            loader.style.display = "none";
            btn.disabled = false;
        }
    }

    function processModel(blob) {
        // Shap-E suele devolver archivos .glb o nubes de puntos. 
        // Para visualización simple, cargamos el objeto generado.
        if (currentMesh) scene.remove(currentMesh);

        const url = URL.createObjectURL(blob);
        
        // Nota: Shap-E por API de inferencia a veces devuelve datos procesados 
        // o requiere un cargador específico según el formato de salida.
        // Aquí simulamos la carga de un objeto básico para la estructura.
        
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });
        currentMesh = new THREE.Mesh(geometry, material);
        scene.add(currentMesh);
        
        status.innerText = "Modelo visualizado (Estructura base lista)";
    }

    document.getElementById('generateBtn').addEventListener('click', () => {
        const prompt = document.getElementById('promptInput').value;
        if (prompt) queryModel(prompt);
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    initThree();
</script>

</body>
</html>
