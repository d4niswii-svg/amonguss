<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Domino AI Pro - Firebase</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>

    <style>
        :root { --cyan: #00f2ff; --felt: #153a1f; --gold: #ffcc00; }
        body { background: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; margin: 0; overflow: hidden; }
        header { background: #111; padding: 15px; border-bottom: 2px solid var(--cyan); text-align: center; font-weight: bold; }
        #board { flex: 1; background: radial-gradient(circle, var(--felt), #000); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .extremos { display: flex; gap: 20px; margin-top: 10px; }
        .nodo { width: 65px; height: 65px; background: rgba(0,0,0,0.7); border: 2px solid var(--gold); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--gold); font-weight: bold; }
        #panel { background: #111; padding: 20px; border-top: 1px solid #333; border-radius: 25px 25px 0 0; }
        #hand-display { display: flex; gap: 12px; overflow-x: auto; padding: 15px 0; min-height: 110px; align-items: center; }
        .tile { width: 48px; height: 90px; background: #fff; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; color: #000; font-weight: 900; font-size: 1.8rem; flex-shrink: 0; }
        .tile.sug { border: 4px solid var(--cyan); box-shadow: 0 0 20px var(--cyan); transform: translateY(-10px); }
        .btn-scan { width: 100%; height: 60px; background: var(--cyan); border: none; border-radius: 15px; font-weight: bold; font-size: 1.2rem; color: #000; }
        #status { font-size: 0.75rem; color: #aaa; text-align: center; margin-top: 10px; text-transform: uppercase; }
        .loading { animation: pulse 1s infinite; color: var(--cyan); }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<header>DOMINO AI <span style="color:var(--cyan)">VISION PRO</span></header>

<div id="board">
    <div style="font-size: 0.8rem; color: var(--gold); letter-spacing: 1px;">MESA</div>
    <div class="extremos">
        <div class="nodo" id="ext-L">-</div>
        <div class="nodo" id="ext-R">-</div>
    </div>
    <div id="status">LISTO</div>
</div>

<div id="panel">
    <div id="hand-display"></div>
    <button class="btn-scan" id="btn-main" onclick="document.getElementById('file-input').click()">📷 ESCANEAR JUEGO</button>
    <input type="file" id="file-input" accept="image/*" style="display:none" onchange="iniciarAnalisis(this)">
</div>

<script>
    // =========================================================
    // 1. TU CONFIGURACIÓN DE FIREBASE (¡ACTUALIZADA!)
    // =========================================================
    const firebaseConfig = {
        apiKey: "AIzaSyC_MyjSFLB-mHDWWaOfAlRetLDB_pAxgR0",
        authDomain: "ango-592a4.firebaseapp.com",
        databaseURL: "https://ango-592a4-default-rtdb.firebaseio.com",
        projectId: "ango-592a4",
        storageBucket: "ango-592a4.firebasestorage.app",
        messagingSenderId: "234305709468",
        appId: "1:234305709468:web:18e64d68b5b8f9e89dd459",
        measurementId: "G-0N3PESVFHR"
    };
    
    // Inicializar Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const analytics = firebase.analytics();

    // =========================================================
    // 2. CONFIGURACIÓN DE IA (CON TU LLAVE GEMINI)
    // =========================================================
    const GEMINI_KEY = "AIzaSyA0oeyaijHRBmX5OBI13hPTRo_dO7x5HHY";
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;

    let appState = { hand: [], ends: [null, null], best: -1 };

    async function iniciarAnalisis(input) {
        if (!input.files[0]) return;
        const status = document.getElementById('status');
        status.innerText = "IA ANALIZANDO...";
        status.className = "loading";

        try {
            const base64Data = await resizeAndBase64(input.files[0]);

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "Detecta las fichas de domino. 1. Mi mano (abajo). 2. Extremos de la mesa. Responde SOLO JSON: {\"mano\": [[6,6], [1,2]], \"extremos\": [6, 4]}" },
                            { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                        ]
                    }]
                })
            });

            const data = await response.json();
            const textResponse = data.candidates[0].content.parts[0].text;
            const result = JSON.parse(textResponse.match(/\{[\s\S]*\}/)[0]);

            appState.hand = result.mano || [];
            appState.ends = result.extremos || [null, null];
            
            calcularMejorJugada();
            renderizar();
            status.innerText = "SINCRO OK";
        } catch (e) {
            status.innerText = "ERROR: REVISA VPN";
            console.error(e);
        } finally {
            status.className = "";
        }
    }

    function calcularMejorJugada() {
        appState.best = -1;
        let maxWeight = -1;
        appState.hand.forEach((f, i) => {
            const puede = appState.ends[0] === null || appState.ends.includes(f[0]) || appState.ends.includes(f[1]);
            if (puede) {
                let peso = f[0] + f[1] + (f[0] === f[1] ? 20 : 0);
                if (peso > maxWeight) { maxWeight = peso; appState.best = i; }
            }
        });
    }

    function renderizar() {
        const handDiv = document.getElementById('hand-display');
        handDiv.innerHTML = '';
        appState.hand.forEach((f, i) => {
            const div = document.createElement('div');
            div.className = `tile ${i === appState.best ? 'sug' : ''}`;
            div.innerHTML = `<span>${f[0]}</span><hr style="width:70%"><span>${f[1]}</span>`;
            handDiv.appendChild(div);
        });
        document.getElementById('ext-L').innerText = appState.ends[0] ?? '-';
        document.getElementById('ext-R').innerText = appState.ends[1] ?? '-';
    }

    function resizeAndBase64(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 600;
                    let w = img.width, h = img.height;
                    if (w > MAX) { h *= MAX / w; w = MAX; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.6).split(',')[1]);
                };
            };
        });
    }
</script>
</body>
</html>
