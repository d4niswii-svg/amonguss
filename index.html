<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ango 3D - GitHub Live</title>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "firebase/app": "https://www.gstatic.com/firebasejs/9.1.1/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/9.1.1/firebase-database.js"
            }
        }
    </script>

    <style>
        body { margin: 0; background: #010409; color: white; font-family: sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 100; background: #0d1117; padding: 20px; border-radius: 10px; width: 260px; border: 1px solid #30363d; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #30363d; background: #010409; color: #58a6ff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #238636; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; color: white; }
        #status { font-size: 11px; margin-top: 10px; color: #8b949e; text-align: center; }
        #viewer { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div id="ui">
    <b style="color:#58a6ff">ANGO 3D - LIVE</b>
    <input type="text" id="promptInput" placeholder="A chair, a cat, a car...">
    <button id="generateBtn">GENERAR 3D</button>
    <div id="status">Listo para GitHub Pages</div>
</div>

<div id="viewer"></div>

<script type="module">
    import { initializeApp } from 'firebase/app';
    import { getDatabase, ref, push } from 'firebase/database';
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

    const firebaseConfig = {
        apiKey: "AIzaSyC_MyjSFLB-mHDWWaOfAlRetLDB_pAxgR0",
        authDomain: "ango-592a4.firebaseapp.com",
        databaseURL: "https://ango-592a4-default-rtdb.firebaseio.com",
        projectId: "ango-592a4",
        storageBucket: "ango-592a4.firebasestorage.app",
        messagingSenderId: "234305709468",
        appId: "1:234305709468:web:4a3009360c6033649dd459"
    };

    initializeApp(firebaseConfig);
    const db = getDatabase();

    const HF_TOKEN = "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";
    const API_URL = "https://router.huggingface.co/openai/shap-e"; 

    let scene, camera, renderer, controls, points;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 3);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('viewer').appendChild(renderer.domElement);
        controls = new OrbitControls(camera, renderer.domElement);
        animate();
    }

    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }

    async function generate() {
        const prompt = document.getElementById('promptInput').value.trim();
        const status = document.getElementById('status');
        const btn = document.getElementById('generateBtn');

        if(!prompt) return;
        btn.disabled = true;
        status.innerText = "Conectando con la IA...";

        try {
            push(ref(db, 'github_live_logs'), { prompt, date: new Date().toISOString() });

            const response = await fetch(API_URL, {
                headers: { 
                    "Authorization": `Bearer ${HF_TOKEN}`,
                    "Content-Type": "application/json"
                },
                method: "POST",
                body: JSON.stringify({ inputs: prompt })
            });

            if (!response.ok) {
                const data = await response.json();
                status.innerText = "IA Cargando: Reintenta en 20s.";
                btn.disabled = false;
                return;
            }

            const blob = await response.blob();
            const buffer = await blob.arrayBuffer();
            const loader = new PLYLoader();
            const geometry = loader.parse(buffer);
            const material = new THREE.PointsMaterial({ size: 0.03, vertexColors: true });

            if(points) scene.remove(points);
            points = new THREE.Points(geometry, material);
            
            geometry.computeBoundingBox();
            const center = new THREE.Vector3();
            geometry.boundingBox.getCenter(center);
            points.position.sub(center);
            
            scene.add(points);
            status.innerText = "¡Generado!";

        } catch (e) {
            status.innerText = "Error de red. Verifica HTTPS.";
            console.error(e);
        } finally {
            btn.disabled = false;
        }
    }

    document.getElementById('generateBtn').onclick = generate;
    init();
</script>
</body>
</html>
